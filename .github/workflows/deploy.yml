name: Deploy

# Every push to main is tested, then deployed to the Lightsail server.
# Setup: docs/DEPLOYMENT.md in corvenide/corven-backend-v2,
# "Automatic deploys (CI/CD)".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://corvanide.space' }}
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server only lets this key run the backend repo's
      # deploy/ci-deploy.sh, which builds and publishes this app.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" frontend

      - name: Check the site is up
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" "$SITE_URL/"
          curl -fsS -o /dev/null -w "%{http_code}\n" "$SITE_URL/dashboard"
